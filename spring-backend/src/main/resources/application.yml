server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/dam-rag;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

rag:
  service-url: http://127.0.0.1:8000
  upload-dir: ./uploads
