<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>登录 & 注册 | 手机验证码 / 手机号密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f3f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 卡片容器 支持简单动画 */
        .auth-card {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            padding: 32px 28px 36px;
            transition: 0.2s;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .sub {
            color: #5b6e8c;
            font-size: 14px;
            margin-bottom: 28px;
        }

        /* 双 tab 切换 */
        .tab-bar {
            display: flex;
            gap: 24px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 28px;
        }

        .tab {
            font-size: 16px;
            font-weight: 600;
            padding-bottom: 10px;
            cursor: pointer;
            color: #64748b;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: #0f172a;
            border-bottom-color: #0f172a;
        }

        /* 通用表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .optional-label {
            color: #64748b;
            font-weight: 400;
            margin-left: 4px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid #e2e8f0;
            border-radius: 24px;
            outline: none;
            background: #ffffff;
            transition: 0.2s;
            font-family: inherit;
        }

        input:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        /* 验证码行（手机登录专用） */
        .captcha-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .captcha-row input {
            flex: 1;
        }

        .get-code-btn {
            white-space: nowrap;
            background: #f1f5f9;
            border: 1.5px solid #e2e8f0;
            border-radius: 40px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            height: 46px;
            transition: 0.2s;
            font-family: inherit;
        }

        .get-code-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .get-code-btn:active {
            transform: scale(0.96);
        }

        /* 主要按钮 */
        .auth-btn {
            width: 100%;
            background: #0f172a;
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 13px;
            border: none;
            border-radius: 40px;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .auth-btn:active {
            transform: scale(0.97);
            background: #1e293b;
        }

        .auth-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* 全局消息提示 */
        .message {
            margin-top: 18px;
            padding: 10px 12px;
            border-radius: 20px;
            font-size: 13px;
            text-align: center;
            background: #f8fafc;
            color: #334155;
        }

        .message.error {
            background: #fee2e2;
            color: #b91c1c;
        }

        .message.success {
            background: #e0f2fe;
            color: #0c4a6e;
        }

        /* 底部切换链接 */
        .footer-nav {
            margin-top: 28px;
            text-align: center;
            font-size: 14px;
        }

        .footer-nav a {
            color: #0f172a;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid #cbd5e1;
            cursor: pointer;
        }

        .footer-nav a:active {
            opacity: 0.7;
        }

        .hide {
            display: none;
        }

        /* 注册表单纯手机号 + 验证码模式特有微调 */
        .reg-note {
            font-size: 12px;
            color: #5b6e8c;
            margin-top: 6px;
            text-align: left;
        }
    </style>
</head>
<body>

<!-- 登录页面卡片 (页面一) -->
<div id="loginPage" class="auth-card">
    <div class="title">工程规范智能服务助手</div>
    <div class="sub">登录你的账户</div>

    <!-- 登录方式切换: 手机验证码 / 手机号密码 -->
    <div class="tab-bar">
        <div class="tab active" data-login-tab="code">手机验证码</div>
        <div class="tab" data-login-tab="pwd">手机号密码</div>
    </div>

    <!-- 手机验证码登录区域 -->
    <div id="loginCodeArea">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" id="loginPhone" placeholder="11位手机号" maxlength="11" inputmode="numeric" autocomplete="tel">
        </div>
        <div class="form-group">
            <label>验证码</label>
            <div class="captcha-row">
                <input type="text" id="loginSmsCode" placeholder="6位验证码" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                <button id="loginSendCodeBtn" class="get-code-btn">获取验证码</button>
            </div>
        </div>
        <button id="doCodeLoginBtn" class="auth-btn">验证码登录</button>
    </div>

    <!-- 手机号密码登录区域 -->
    <div id="loginPwdArea" class="hide">
        <div class="form-group">
            <label>手机号</label>
            <input type="tel" id="loginPwdPhone" placeholder="11位手机号" maxlength="11" inputmode="numeric" autocomplete="tel">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button id="doPwdLoginBtn" class="auth-btn">密码登录</button>
    </div>

    <!-- 全局消息 -->
    <!-- <div id="loginMsg" class="message"></div> -->

    <!-- 跳转注册链接 -->
    <div class="footer-nav">
        <a id="toRegisterLink">还没有账号？立即注册 →</a>
    </div>
</div>

<!-- 注册页面卡片 (页面二，默认隐藏) -->
<div id="registerPage" class="auth-card hide">
    <div class="title">创建账号</div>
    <div class="sub">使用手机号快速注册</div>

    <!-- 注册表单：手机号唯一；用户名仅作展示昵称；user_id 由后端自动生成，前端不展示也不提交 -->
    <div class="form-group">
        <label>手机号</label>
        <input type="tel" id="regPhone" placeholder="11位手机号" maxlength="11" inputmode="numeric" autocomplete="tel">
    </div>
    <div class="form-group">
        <label>验证码</label>
        <div class="captcha-row">
            <input type="text" id="regSmsCode" placeholder="6位验证码" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            <button id="regSendCodeBtn" class="get-code-btn">获取验证码</button>
        </div>
    </div>
    <div class="form-group">
        <label>用户名</label>
        <input type="text" id="regUsername" placeholder="支持中英文、数字" maxlength="20" autocomplete="nickname">
    </div>
    <div class="form-group">
        <label>密码</label>
        <input type="password" id="regPassword" placeholder="至少6位，字母/数字/符号" autocomplete="new-password">
    </div>
    <div class="form-group">
        <label>确认密码</label>
        <input type="password" id="regConfirmPwd" placeholder="再次输入密码" autocomplete="new-password">
    </div>
    <button id="doRegisterBtn" class="auth-btn">立即注册</button>
    <!-- <div id="regMsg" class="message"></div> -->

    <div class="footer-nav">
        <a id="backToLoginLink">← 已有账号？去登录</a>
    </div>
</div>

<script>
    // ---------- DOM 元素 ----------
    // 登录页 & 注册页容器
    const loginPage = document.getElementById('loginPage');
    const registerPage = document.getElementById('registerPage');
    // 登录切换tab
    const codeTab = document.querySelector('[data-login-tab="code"]');
    const pwdTab = document.querySelector('[data-login-tab="pwd"]');
    const loginCodeArea = document.getElementById('loginCodeArea');
    const loginPwdArea = document.getElementById('loginPwdArea');
    // 登录表单相关
    const loginPhoneInput = document.getElementById('loginPhone');
    const loginSmsCodeInput = document.getElementById('loginSmsCode');
    const loginSendCodeBtn = document.getElementById('loginSendCodeBtn');
    const doCodeLoginBtn = document.getElementById('doCodeLoginBtn');
    const loginPwdPhoneInput = document.getElementById('loginPwdPhone');
    const loginPasswordInput = document.getElementById('loginPassword');
    const doPwdLoginBtn = document.getElementById('doPwdLoginBtn');
    const loginMsgDiv = document.getElementById('loginMsg');

    // 注册表单相关
    const regPhoneInput = document.getElementById('regPhone');
    const regSmsCodeInput = document.getElementById('regSmsCode');
    const regSendCodeBtn = document.getElementById('regSendCodeBtn');
    const regUsernameInput = document.getElementById('regUsername');
    const regPasswordInput = document.getElementById('regPassword');
    const regConfirmPwdInput = document.getElementById('regConfirmPwd');
    const doRegisterBtn = document.getElementById('doRegisterBtn');
    const regMsgDiv = document.getElementById('regMsg');

    // 跳转链接
    const toRegisterLink = document.getElementById('toRegisterLink');
    const backToLoginLink = document.getElementById('backToLoginLink');

    // ---------- 全局公用变量（用于模拟验证码存储）----------
    // 注意：登录页和注册页共用两套独立的验证码存储变量(演示用途，真实场景后端按手机号存储)
    let loginLastSentCode = null;      // 登录页最后一次发送的验证码
    let regLastSentCode = null;        // 注册页最后一次发送的验证码
    let loginCodePhone = null;
    let regCodePhone = null;
    let loginCountdown = 0;
    let regCountdown = 0;
    let loginTimer = null;
    let regTimer = null;

    // 演示用户表：真实系统中由后端数据库保证 phone 唯一，并自动生成不可修改的 user_id 主键。
    const demoUsersByPhone = new Map([
        ['13800000000', {
            user_id: 1000,
            phone: '13800000000',
            username: '演示用户',
            password: '123456'
        }]
    ]);
    let nextDemoUserId = 1001;

    // ------ 通用辅助函数 -----
    function isValidPhone(phone) {
        return /^1[3-9]\d{9}$/.test(phone);
    }

    function showMessage(element, text, type = '') {
        element.textContent = text;
        element.className = 'message';
        if (type === 'error') element.classList.add('error');
        else if (type === 'success') element.classList.add('success');
        if (type !== 'error') {
            setTimeout(() => {
                if (element.textContent === text) {
                    element.textContent = '';
                    element.className = 'message';
                }
            }, 2800);
        }
    }

    // 更新登录页验证码按钮
    function updateLoginCodeBtn() {
        if (loginCountdown > 0) {
            loginSendCodeBtn.disabled = true;
            loginSendCodeBtn.textContent = `${loginCountdown}秒后重试`;
        } else {
            loginSendCodeBtn.disabled = false;
            loginSendCodeBtn.textContent = '获取验证码';
        }
    }

    function startLoginCountdown(seconds) {
        if (loginTimer) clearInterval(loginTimer);
        loginCountdown = seconds;
        updateLoginCodeBtn();
        loginTimer = setInterval(() => {
            if (loginCountdown <= 1) {
                clearInterval(loginTimer);
                loginTimer = null;
                loginCountdown = 0;
                updateLoginCodeBtn();
            } else {
                loginCountdown--;
                updateLoginCodeBtn();
            }
        }, 1000);
    }

    // 更新注册页验证码按钮
    function updateRegCodeBtn() {
        if (regCountdown > 0) {
            regSendCodeBtn.disabled = true;
            regSendCodeBtn.textContent = `${regCountdown}秒后重试`;
        } else {
            regSendCodeBtn.disabled = false;
            regSendCodeBtn.textContent = '获取验证码';
        }
    }

    function startRegCountdown(seconds) {
        if (regTimer) clearInterval(regTimer);
        regCountdown = seconds;
        updateRegCodeBtn();
        regTimer = setInterval(() => {
            if (regCountdown <= 1) {
                clearInterval(regTimer);
                regTimer = null;
                regCountdown = 0;
                updateRegCodeBtn();
            } else {
                regCountdown--;
                updateRegCodeBtn();
            }
        }, 1000);
    }

    // ----- 模拟后端发送验证码 (登录/注册 分离) -----
    // 登录页发送验证码
    async function sendLoginSmsCode(phone) {
        return new Promise((resolve) => {
            setTimeout(() => {
                if (!isValidPhone(phone)) {
                    resolve({ success: false, message: '手机号格式错误' });
                    return;
                }
                if (!demoUsersByPhone.has(phone)) {
                    resolve({ success: false, message: '该手机号未注册，请先注册' });
                    return;
                }
                const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
                loginLastSentCode = randomCode;
                loginCodePhone = phone;
                console.log(`[登录] 验证码 ${randomCode} 发送至 ${phone} (万能测试码123456同样有效)`);
                resolve({ success: true, message: '验证码已发送' });
            }, 400);
        });
    }

    async function onLoginGetCode() {
        const phone = loginPhoneInput.value.trim();
        if (!phone) {
            showMessage(loginMsgDiv, '请填写手机号', 'error');
            loginPhoneInput.focus();
            return;
        }
        if (!isValidPhone(phone)) {
            showMessage(loginMsgDiv, '手机号格式不正确', 'error');
            return;
        }
        if (loginCountdown > 0) {
            showMessage(loginMsgDiv, `请等待 ${loginCountdown} 秒`, 'error');
            return;
        }
        loginSendCodeBtn.disabled = true;
        loginSendCodeBtn.textContent = '发送中...';
        try {
            const res = await sendLoginSmsCode(phone);
            if (res.success) {
                showMessage(loginMsgDiv, `验证码已发送至 ${phone} (演示码: ${loginLastSentCode} / 123456)`, 'success');
                startLoginCountdown(60);
                loginSmsCodeInput.value = '';
                loginSmsCodeInput.focus();
            } else {
                showMessage(loginMsgDiv, res.message, 'error');
                loginSendCodeBtn.disabled = false;
                loginSendCodeBtn.textContent = '获取验证码';
            }
        } catch (err) {
            showMessage(loginMsgDiv, '网络错误', 'error');
            loginSendCodeBtn.disabled = false;
            loginSendCodeBtn.textContent = '获取验证码';
        }
    }

    // 注册页发送验证码
    async function sendRegSmsCode(phone) {
        return new Promise((resolve) => {
            setTimeout(() => {
                if (!isValidPhone(phone)) {
                    resolve({ success: false, message: '手机号格式错误' });
                    return;
                }
                if (demoUsersByPhone.has(phone)) {
                    resolve({ success: false, message: '该手机号已注册，请直接登录' });
                    return;
                }
                const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
                regLastSentCode = randomCode;
                regCodePhone = phone;
                console.log(`[注册] 验证码 ${randomCode} 发送至 ${phone} (万能123456同时可用)`);
                resolve({ success: true, message: '验证码已发送' });
            }, 400);
        });
    }

    async function onRegGetCode() {
        const phone = regPhoneInput.value.trim();
        if (!phone) {
            showMessage(regMsgDiv, '请填写手机号', 'error');
            regPhoneInput.focus();
            return;
        }
        if (!isValidPhone(phone)) {
            showMessage(regMsgDiv, '手机号格式不正确', 'error');
            return;
        }
        if (regCountdown > 0) {
            showMessage(regMsgDiv, `请等待 ${regCountdown} 秒后重试`, 'error');
            return;
        }
        regSendCodeBtn.disabled = true;
        regSendCodeBtn.textContent = '发送中...';
        try {
            const res = await sendRegSmsCode(phone);
            if (res.success) {
                showMessage(regMsgDiv, `验证码已发送 (演示: ${regLastSentCode} / 123456)`, 'success');
                startRegCountdown(60);
                regSmsCodeInput.value = '';
                regSmsCodeInput.focus();
            } else {
                showMessage(regMsgDiv, res.message, 'error');
                regSendCodeBtn.disabled = false;
                regSendCodeBtn.textContent = '获取验证码';
            }
        } catch (err) {
            showMessage(regMsgDiv, '发送失败', 'error');
            regSendCodeBtn.disabled = false;
            regSendCodeBtn.textContent = '获取验证码';
        }
    }

    // ---------------- 登录校验 (模拟接口) ----------------
    async function requestCodeLogin(phone, code) {
        return new Promise((resolve) => {
            setTimeout(() => {
                const user = demoUsersByPhone.get(phone);
                if (!user) {
                    resolve({ success: false, message: '手机号未注册，请先注册' });
                    return;
                }
                const isValid = (code === '123456') || (loginLastSentCode && code === loginLastSentCode && loginCodePhone === phone);
                if (isValid) {
                    resolve({
                        success: true,
                        message: '登录成功',
                        user: {
                            user_id: user.user_id,
                            phone: user.phone,
                            username: user.username
                        }
                    });
                } else {
                    resolve({ success: false, message: '验证码错误或已过期' });
                }
            }, 600);
        });
    }

    async function handleCodeLogin() {
        const phone = loginPhoneInput.value.trim();
        const code = loginSmsCodeInput.value.trim();
        if (!phone || !isValidPhone(phone)) {
            showMessage(loginMsgDiv, '手机号无效', 'error');
            return;
        }
        if (!code || !/^\d{6}$/.test(code)) {
            showMessage(loginMsgDiv, '请输入6位验证码', 'error');
            return;
        }
        doCodeLoginBtn.disabled = true;
        doCodeLoginBtn.textContent = '登录中...';
        try {
            const res = await requestCodeLogin(phone, code);
            if (res.success) {
                showMessage(loginMsgDiv, '✅ 登录成功', 'success');
                setTimeout(() => {
                    alert('演示登录成功！实际可跳转至控制台');
                    doCodeLoginBtn.disabled = false;
                    doCodeLoginBtn.textContent = '验证码登录';
                }, 800);
            } else {
                showMessage(loginMsgDiv, res.message, 'error');
                doCodeLoginBtn.disabled = false;
                doCodeLoginBtn.textContent = '验证码登录';
            }
        } catch (err) {
            showMessage(loginMsgDiv, '请求失败', 'error');
            doCodeLoginBtn.disabled = false;
            doCodeLoginBtn.textContent = '验证码登录';
        }
    }

    // 手机号密码登录模拟：用户名不参与登录。
    async function requestPwdLogin(phone, pwd) {
        return new Promise((resolve) => {
            setTimeout(() => {
                const user = demoUsersByPhone.get(phone);
                if (user && user.password === pwd) {
                    resolve({
                        success: true,
                        message: '登录成功',
                        user: {
                            user_id: user.user_id,
                            phone: user.phone,
                            username: user.username
                        }
                    });
                } else {
                    resolve({ success: false, message: '手机号或密码错误' });
                }
            }, 500);
        });
    }

    async function handlePwdLogin() {
        const phone = loginPwdPhoneInput.value.trim();
        const pwd = loginPasswordInput.value.trim();
        if (!phone || !isValidPhone(phone)) {
            showMessage(loginMsgDiv, '请填写正确的手机号', 'error');
            loginPwdPhoneInput.focus();
            return;
        }
        if (!pwd) {
            showMessage(loginMsgDiv, '请输入密码', 'error');
            return;
        }
        doPwdLoginBtn.disabled = true;
        doPwdLoginBtn.textContent = '登录中...';
        try {
            const res = await requestPwdLogin(phone, pwd);
            if (res.success) {
                showMessage(loginMsgDiv, `🎉 ${res.message}`, 'success');
                setTimeout(() => {
                    alert('密码登录演示成功！');
                    doPwdLoginBtn.disabled = false;
                    doPwdLoginBtn.textContent = '密码登录';
                }, 700);
            } else {
                showMessage(loginMsgDiv, res.message, 'error');
                doPwdLoginBtn.disabled = false;
                doPwdLoginBtn.textContent = '密码登录';
            }
        } catch (err) {
            showMessage(loginMsgDiv, '服务异常', 'error');
            doPwdLoginBtn.disabled = false;
            doPwdLoginBtn.textContent = '密码登录';
        }
    }

    // ---------- 注册逻辑 (前端模拟，真实需调用后端接口) ----------
    async function requestRegister(phone, code, username, password) {
        return new Promise((resolve) => {
            setTimeout(() => {
                // 校验验证码：万能123456 或 与上次发送的一致
                const codeValid = (code === '123456') || (regLastSentCode && code === regLastSentCode && regCodePhone === phone);
                if (!codeValid) {
                    resolve({ success: false, message: '验证码错误或失效' });
                    return;
                }
                if (password.length < 6) {
                    resolve({ success: false, message: '密码至少6位' });
                    return;
                }
                // 手机号唯一性由后端数据库约束保证；这里用内存 Map 模拟。
                if (demoUsersByPhone.has(phone)) {
                    resolve({ success: false, message: '该手机号已注册' });
                    return;
                }
                const displayName = username || `用户${phone.slice(-4)}`;
                const newUser = {
                    user_id: nextDemoUserId++,
                    phone,
                    username: displayName,
                    password
                };
                demoUsersByPhone.set(phone, newUser);
                resolve({
                    success: true,
                    message: '注册成功，请登录',
                    user: {
                        user_id: newUser.user_id,
                        phone: newUser.phone,
                        username: newUser.username
                    }
                });
            }, 700);
        });
    }

    async function handleRegister() {
        const phone = regPhoneInput.value.trim();
        const code = regSmsCodeInput.value.trim();
        const username = regUsernameInput.value.trim();
        const pwd = regPasswordInput.value.trim();
        const confirmPwd = regConfirmPwdInput.value.trim();

        if (!phone || !isValidPhone(phone)) {
            showMessage(regMsgDiv, '请填写正确的手机号', 'error');
            return;
        }
        if (!code || !/^\d{6}$/.test(code)) {
            showMessage(regMsgDiv, '验证码为6位数字', 'error');
            return;
        }
        if (!pwd) {
            showMessage(regMsgDiv, '请设置密码', 'error');
            return;
        }
        if (pwd !== confirmPwd) {
            showMessage(regMsgDiv, '两次密码输入不一致', 'error');
            return;
        }
        if (pwd.length < 6) {
            showMessage(regMsgDiv, '密码长度至少6位', 'error');
            return;
        }

        doRegisterBtn.disabled = true;
        doRegisterBtn.textContent = '注册中...';
        try {
            const res = await requestRegister(phone, code, username, pwd);
            if (res.success) {
                showMessage(regMsgDiv, `✅ ${res.message}，即将跳转登录`, 'success');
                setTimeout(() => {
                    // 注册成功后切换到登录页，并填上手机号方便登录
                    switchToLogin();
                    // 可以预填登录手机号
                    loginPhoneInput.value = phone;
                    loginPwdPhoneInput.value = phone;
                    showMessage(loginMsgDiv, '注册成功，现在可以使用手机验证码或手机号密码登录', 'success');
                    doRegisterBtn.disabled = false;
                    doRegisterBtn.textContent = '立即注册';
                }, 1000);
            } else {
                showMessage(regMsgDiv, res.message, 'error');
                doRegisterBtn.disabled = false;
                doRegisterBtn.textContent = '立即注册';
            }
        } catch (err) {
            showMessage(regMsgDiv, '注册失败，请重试', 'error');
            doRegisterBtn.disabled = false;
            doRegisterBtn.textContent = '立即注册';
        }
    }

    // ------- 页面切换 ----------
    function switchToRegister() {
        loginPage.classList.add('hide');
        registerPage.classList.remove('hide');
        // 清空注册页消息以及重置验证码相关状态（不清存储变量也没事）
        regMsgDiv.textContent = '';
        regMsgDiv.className = 'message';
        // 清除倒计时不影响体验
    }

    function switchToLogin() {
        registerPage.classList.add('hide');
        loginPage.classList.remove('hide');
        loginMsgDiv.textContent = '';
        loginMsgDiv.className = 'message';
        // 重置登录页可能遗留的验证码过期提醒 (美化)
    }

    // 登录方式切换
    function setLoginTab(tabType) {
        if (tabType === 'code') {
            codeTab.classList.add('active');
            pwdTab.classList.remove('active');
            loginCodeArea.classList.remove('hide');
            loginPwdArea.classList.add('hide');
        } else {
            pwdTab.classList.add('active');
            codeTab.classList.remove('active');
            loginPwdArea.classList.remove('hide');
            loginCodeArea.classList.add('hide');
        }
        loginMsgDiv.textContent = '';
    }

    // ----- 事件绑定 -----
    codeTab.addEventListener('click', () => setLoginTab('code'));
    pwdTab.addEventListener('click', () => setLoginTab('pwd'));
    loginSendCodeBtn.addEventListener('click', onLoginGetCode);
    doCodeLoginBtn.addEventListener('click', handleCodeLogin);
    doPwdLoginBtn.addEventListener('click', handlePwdLogin);

    regSendCodeBtn.addEventListener('click', onRegGetCode);
    doRegisterBtn.addEventListener('click', handleRegister);

    toRegisterLink.addEventListener('click', switchToRegister);
    backToLoginLink.addEventListener('click', switchToLogin);

    // 初始化清理提示
    updateLoginCodeBtn();
    updateRegCodeBtn();
    // 默认显示手机验证码登录tab
    setLoginTab('code');
</script>
</body>
</html>
